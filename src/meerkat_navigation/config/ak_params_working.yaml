bt_navigator:
  ros__parameters:
    global_frame: map
    robot_base_frame: base_link
    odom_topic: "/odom"
    bt_loop_duration: 10 #in ms, behavior tree execution loop duration
    default_server_timeout: 20
    wait_for_service_timeout: 1000
    action_server_result_timeout: 900.0
    navigators: ["navigate_to_pose", "navigate_through_poses"]
    navigate_to_pose:
      plugin: "nav2_bt_navigator::NavigateToPoseNavigator"
    navigate_through_poses:
      plugin: "nav2_bt_navigator::NavigateThroughPosesNavigator"
    error_code_names:
      - compute_path_error_code
      - follow_path_error_code
      - navigate_to_pose_error_code
      - navigate_through_poses_error_code

    transform_tolerance: 0.3
    # In sec; the time window which the transforms are considered valid.
map_server:
  ros__parameters:
    yaml_filename: >
      /media/meerkat/Meerkat/aknav_ws/src/meerkat_navigation/maps/test_parcelD_passage.yaml
    topic_name: "/map"
    frame_id: "map"
    use_sim_time: false
    topic_qos_overrides:
      /map:
        durability: transient_local
        reliability: reliable
controller_server:
  ros__parameters:
    local_costmap:
      update_frequency: 5.0
      publish_frequency: 5.0
      global_frame: odom
      robot_base_frame: base_link
      rolling_window: true
      resolution: 0.05
      robot_radius: 0.25
      verbose: true
      plugins:
        - obstacle_layer
        - denoise_layer
        - inflation_layer
        #- static_layer
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        observation_sources: scan
        scan:
          topic: /scan
          raytrace_min_range: 0.20
          obstacle_min_range: 0.20
          max_obstacle_height: 2.0
          clearing: true
          marking: true
          data_type: "LaserScan"
      denoise_layer:
        plugin: "nav2_costmap_2d::DenoiseLayer"
        enabled: true
        minimal_group_size: 2
        group_connectivity_type: 8
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 5 #previous 2.58
        inflation_radius: 0.6
      #static_layer:
      #plugin: "nav2_costmap_2d::StaticLayer"
      #map_topic: /map
        map_subscribe_transient_local: true
      always_send_full_costmap: true
    controller_frequency: 10.0 #20 befor
    costmap_update_timeout: 0.30
    min_x_velocity_threshold: 0.001 # in m/s
    min_y_velocity_threshold: 0.001
    min_theta_velocity_threshold: 0.001 #in rad/sec
    failure_tolerance: 0.3
    odom_topic: "odom"
    progress_checker_plugins: ["progress_checker"]
    goal_checker_plugins: ["general_goal_checker"]
    #general_goal_checker.xy_goal_tolerance: 0.25
    #general_goal_checker.yaw_goal_tolerance: 0.40
    controller_plugins: ["FollowPath"]
    use_realtime_priority: false
    topic_qos_overrides:
      /map:
        durability: transient_local
        reliability: reliable
    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.01
      movement_time_allowance: 10.0
    general_goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"
      stateful: true
      xy_goal_tolerance: 0.35
      yaw_goal_tolerance: 0.50
    FollowPath:
      plugin: "nav2_mppi_controller::MPPIController"
      #nav2_mppi_controller::MPPIController
      # --- Diff-drive specific tuning ----------------------------------------
      motion_model: "DiffDrive"     # <-- was Omni
      # No lateral motion (for DiffDrive robots):
      vy_max: 0.0                      # No sideways motion
      vy_std: 0.0
      ay_max: 0.0
      ay_min: 0.0

      # Longitudinal motion (forward/backward):
      vx_max: 0.15                     # Max forward speed (m/s): balanced for indoor/outdoor
      vx_std: 0.10                     # Small velocity noise (smoother sampling)
      ax_max: 0.8                     # Slow acceleration
      ax_min: -0.8                    # Slow deceleration (avoids sudden halts)

      # Angular motion (turning):
      az_max: 0.04                     # Smooth angular acceleration
      az_min: -0.04                    # Smooth angular deceleration
      wz_max: 0.12                    # Max turn rate (rad/s): slow but responsive
      #wz_min: -0.12                   # Optional
      wz_std: 0.05                     # Less noise in angular velocity

      # MPPI configuration:
      time_steps: 15                  # Trajectory horizon
      model_dt: 0.1                   # Sample resolution
      batch_size: 2000                # Number of sampled trajectories
      iteration_count: 3             # Optimization iterations

      prune_distance: 1.7            # Distance after which to prune the path
      transform_tolerance: 0.3       # TF transform grace window

      temperature: 0.25              # Slight randomness for exploration, still smooth
      gamma: 0.012                   # Cost regularization: helps prevent abrupt paths
      visualize: true
      regenerate_noises: false
      TrajectoryVisualizer:
        trajectory_step: 5
        time_step: 3
      critics: [
        "ConstraintCritic", "CostCritic", "ObstaclesCritic", "GoalCritic",
        "GoalAngleCritic", "PathAlignCritic", "PathAngleCritic",
        "PathFollowCritic", "PreferForwardCritic", "TwirlingCritic"]
      ConstraintCritic:
        enabled: true
        cost_power: 1
        cost_weight: 4.0
      CostCritic:
        enabled: true
        consider_footprint: false
        cost_power: 1
        cost_weight: 3.81
        near_collision_cost: 253
        critical_cost: 300.0
        #consider_footprint: false
        collision_cost: 1000000.0
        near_goal_distance: 1.0
        trajectory_point_step: 2
      ObstaclesCritic:
        enabled: true
        consider_footprint: false
        cost_power: 1
        repulsion_weight: 1.5
        critical_weight: 20.0
        collision_cost: 10000.0
        collision_margin_distance: 0.1
        near_goal_distance: 0.5
      GoalCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0
        threshold_to_consider: 1.4
      GoalAngleCritic:
        enabled: true
        cost_power: 1
        cost_weight: 3.0
        threshold_to_consider: 0.5
      PathAlignCritic:
        enabled: true
        cost_power: 1
        cost_weight: 14.0
        max_path_occupancy_ratio: 0.05
        trajectory_point_step: 4
        threshold_to_consider: 0.5
        offset_from_furthest: 20
        use_path_orientations: false
      PathAngleCritic:
        enabled: true
        cost_power: 1
        cost_weight: 2.0
        offset_from_furthest: 4
        threshold_to_consider: 0.5
        max_angle_to_furthest: 1.0
        #mode: 0
      PathFollowCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0
        offset_from_furthest: 5
        threshold_to_consider: 1.4
      PreferForwardCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0
        threshold_to_consider: 0.5
      TwirlingCritic:
        enabled: true
        twirling_cost_power: 1
        twirling_cost_weight: 10.0
map_saver:
  ros__parameters:
    save_map_timeout: 5.0
    free_thresh_default: 0.25
    occupied_thresh_default: 0.65
    map_subscribe_transient_local: true
planner_server:
  ros__parameters:
    global_costmap:
      update_frequency: 5.0
      publish_frequency: 5.0
      global_frame: map
      robot_base_frame: base_link
      robot_radius: 0.25

      resolution: 0.05
      track_unknown_space: true
      rolling_window: false
      # width: 20
      # height: 20
      # origin_x: -10.0
      # origin_y: -10.0
      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]
      topic_qos_overrides:
        /map:
          durability: transient_local
          reliability: reliable
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_topic: /map
        map_subscribe_transient_local: true
        use_maximum: true
        trinary_costmap: true
        track_unknown_space: true
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        observation_sources: scan
        scan:
          topic: /scan
          raytrace_min_range: 0.20
          obstacle_min_range: 0.20
          max_obstacle_height: 2.0
          clearing: true
          marking: true
          data_type: "LaserScan"
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 5
        inflation_radius: 1.75
      always_send_full_costmap: true
    expected_planner_frequency: 10.0 #20 befor
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_navfn_planner/NavfnPlanner"
      tolerance: 0.5
      use_astar: false
      allow_unknown: true #New layer unitll smoothserver
smoother_server:
  ros__parameters:
    smoother_plugins: ["simple_smoother"]
    simple_smoother:
      plugin: "nav2_smoother::SimpleSmoother"
      tolerance: 1.0e-10
      max_its: 1000
      do_refinement: true
behavior_server:
  ros__parameters:
    local_costmap_topic: local_costmap/costmap_raw
    global_costmap_topic: global_costmap/costmap_raw
    #local_footprint_topic: local_costmap/published_footprint
    #global_footprint_topic: global_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins: ["spin", "backup", "drive_on_heading", "wait"]
    spin:
      plugin: "nav2_behaviors/Spin"
    backup:
      plugin: "nav2_behaviors/BackUp"
    drive_on_heading:
      plugin: "nav2_behaviors/DriveOnHeading"
    wait:
      plugin: "nav2_behaviors/Wait"
    local_frame: odom
    global_frame: map
    robot_base_frame: base_link
    transform_tolerance: 0.1
    simulate_ahead_time: 2.0
    max_rotational_vel: 0.1     # ↓ was 0.50
    min_rotational_vel: 0.05     # ↓ was 0.40
    rotational_acc_lim: 1.0     # ↓ was 3.2
waypoint_follower:
  ros__parameters:
    loop_rate: 5
    stop_on_failure: false
    action_server_result_timeout: 900.0
    waypoint_task_executor_plugin: "wait_at_waypoint"
    wait_at_waypoint:
      plugin: "nav2_waypoint_follower::WaitAtWaypoint"
      enabled: true
      waypoint_pause_duration: 10
collision_monitor:
  ros__parameters:
    base_frame_id: "base_link"        # unify with costmaps
    odom_frame_id: "odom"
    cmd_vel_in_topic: "/meerkat/cmd_vel"       # match controller output
    cmd_vel_out_topic: "/meerkat/cmd_vel"
    state_topic: "collision_monitor_state"
    transform_tolerance: 0.3
    source_timeout: 1.0
    base_shift_correction: true
    stop_pub_timeout: 2.0
    polygons: ["ApproachCircle"]
    ApproachCircle:
      type: "circle"
      action_type: "approach"
      radius: 0.25             # set to your robot's radius (in meters)
      time_before_collision: 1.2
      visualize: false         # optional
      enabled: true
    observation_sources: ["scan"]
    scan:
      type: "scan"
      topic: /scan
      min_height: 0.15
      max_height: 2.0
      enabled: true