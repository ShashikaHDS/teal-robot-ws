---
amcl:
  ros__parameters:
    alpha1: 0.05
    alpha2: 0.05
    alpha3: 0.05
    alpha4: 0.05
    alpha5: 0.01
    base_frame_id: "base_link"
    #Matches the typical default base frame for many robots
    beam_skip_distance: 0.5
    beam_skip_error_threshold: 0.9
    beam_skip_threshold: 0.3
    #Defines the percentage of beams that must be considered for skipping
    #before beam skipping is even attempted.
    do_beamskip: false
    global_frame_id: "map"
    lambda_short: 0.1
    laser_likelihood_max_dist: 2.0
    laser_max_range: 10.0
    laser_min_range: 0.05
    laser_model_type: "likelihood_field"
    max_beams: 60
    max_particles: 1500
    min_particles: 400
    odom_frame_id: "odom"
    pf_err: 0.05
    pf_z: 0.99
    recovery_alpha_fast: 0.0
    recovery_alpha_slow: 0.0
    resample_interval: 1
    robot_model_type: "nav2_amcl::DifferentialMotionModel"
    save_pose_rate: 0.5
    sigma_hit: 0.2
    tf_broadcast: true
    transform_tolerance: 0.2
    update_min_a: 0.1
    #"""The default 0.2 is about 11.5 degrees. Increasing this value means
    #fewer updates, saving computation.
    #Decreasing it (like to 0.05) makes the robot update more often,
    #which is better for slow or precise movements.
    update_min_d: 0.15
    #Smaller than the default of 0.25, requiring less translational
    #movement before updating. Better for slow-moving robots.
    z_hit: 0.5
    z_max: 0.05
    z_rand: 0.5
    z_short: 0.05
    scan_topic: /scan
bt_navigator:
  ros__parameters:
    global_frame: map
    robot_base_frame: base_link
    odom_topic: "/odom"
    bt_loop_duration: 10 #in ms, behavior tree execution loop duration
    default_server_timeout: 20
    wait_for_service_timeout: 1000
    action_server_result_timeout: 900.0
    navigators: ["navigate_to_pose", "navigate_through_poses"]
    navigate_to_pose:
      plugin: "nav2_bt_navigator::NavigateToPoseNavigator"
    navigate_through_poses:
      plugin: "nav2_bt_navigator::NavigateThroughPosesNavigator"
    error_code_names:
      - compute_path_error_code
      - follow_path_error_code
      - navigate_to_pose_error_code
      - navigate_through_poses_error_code

    transform_tolerance: 0.2
    # In sec; the time window which the transforms are considered valid.
map_server:
  ros__parameters:
    yaml_filename: >
      /media/meerkat/Meerkat/aryan_ws/src/meerkat_navigation/maps/onestop_map.yaml
    topic_name: "/map"
    frame_id: "map"
    use_sim_time: false
    topic_qos_overrides:
      /map:
        durability: transient_local
        reliability: reliable
controller_server:
  ros__parameters:
    local_costmap:
      update_frequency: 10.0
      publish_frequency: 10.0
      global_frame: odom
      robot_base_frame: base_link
      rolling_window: true
      resolution: 0.05
      robot_radius: 0.25
      verbose: true
      plugins:
        - obstacle_layer
        - denoise_layer
        - inflation_layer
        #- static_layer
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        observation_sources: scan
        scan:
          topic: /scan
          raytrace_min_range: 0.20
          obstacle_min_range: 0.20
          max_obstacle_height: 2.0
          clearing: true
          marking: true
          data_type: "LaserScan"
      denoise_layer:
        plugin: "nav2_costmap_2d::DenoiseLayer"
        enabled: true
        minimal_group_size: 2
        group_connectivity_type: 8
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 5 #previous 2.58
        inflation_radius: 0.6
      #static_layer:
      #plugin: "nav2_costmap_2d::StaticLayer"
      #map_topic: /map
        map_subscribe_transient_local: true
      always_send_full_costmap: true
    controller_frequency: 20.0
    velocity_smoother_topic: /cmd_vel_smoothed #Control server publishes to /meerkat/cmd_smoothed
    costmap_update_timeout: 0.30
    min_x_velocity_threshold: 0.001 # in m/s
    min_y_velocity_threshold: 0.001
    min_theta_velocity_threshold: 0.001 #in rad/sec
    failure_tolerance: 0.3
    odom_topic: "odom"
    progress_checker_plugins: ["progress_checker"]
    goal_checker_plugins: ["general_goal_checker"]
    #general_goal_checker.xy_goal_tolerance: 0.25
    #general_goal_checker.yaw_goal_tolerance: 0.40
    controller_plugins: ["FollowPath"]
    use_realtime_priority: false
    topic_qos_overrides:
      /map:
        durability: transient_local
        reliability: reliable
    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.5
      movement_time_allowance: 10.0
    general_goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"
      stateful: true
      xy_goal_tolerance: 0.35
      yaw_goal_tolerance: 0.50
    FollowPath:
      plugin: "nav2_mppi_controller::MPPIController"
      #nav2_mppi_controller::MPPIController
      # --- Diff-drive specific tuning ----------------------------------------
      motion_model: "DiffDrive"     # <-- was Omni
  # No lateral motion:
      vy_max: 0.0
      vy_std: 0.0
      ay_max: 0.0
      ay_min: 0.0
      # Longitudinal & angular motion:
      vx_max: 0.26
      vx_std: 0.1
      ax_max: 0.25
      ax_min: -0.25
      az_max: 0.5  # maximum angular acceleration (rad/s²)
      az_min: -0.5  # maximum angular deceleration (rad/s²)
      wz_max: 0.3
      wz_std: 0.2
      time_steps: 15
      model_dt: 0.1
      batch_size: 2000
      iteration_count: 3
      prune_distance: 1.7
      transform_tolerance: 0.2
      temperature: 0.3
      gamma: 0.05
      visualize: false
      regenerate_noises: false
      TrajectoryVisualizer:
        trajectory_step: 5
        time_step: 3
      critics: [
        "ConstraintCritic", "CostCritic", "ObstaclesCritic", "GoalCritic",
        "GoalAngleCritic", "PathAlignCritic", "PathAngleCritic",
        "PathFollowCritic", "PreferForwardCritic", "TwirlingCritic"]
      ConstraintCritic:
        enabled: true
        cost_power: 1
        cost_weight: 4.0
      CostCritic:
        enabled: true
        consider_footprint: false
        cost_power: 1
        cost_weight: 3.81
        near_collision_cost: 253
        critical_cost: 300.0
        #consider_footprint: false
        collision_cost: 1000000.0
        near_goal_distance: 1.0
        trajectory_point_step: 2
      ObstaclesCritic:
        enabled: true
        consider_footprint: false
        cost_power: 1
        repulsion_weight: 1.5
        critical_weight: 20.0
        collision_cost: 10000.0
        collision_margin_distance: 0.1
        near_goal_distance: 0.5
      GoalCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0
        threshold_to_consider: 1.4
      GoalAngleCritic:
        enabled: true
        cost_power: 1
        cost_weight: 3.0
        threshold_to_consider: 0.5
      PathAlignCritic:
        enabled: true
        cost_power: 1
        cost_weight: 14.0
        max_path_occupancy_ratio: 0.05
        trajectory_point_step: 4
        threshold_to_consider: 0.5
        offset_from_furthest: 20
        use_path_orientations: false
      PathAngleCritic:
        enabled: true
        cost_power: 1
        cost_weight: 2.0
        offset_from_furthest: 4
        threshold_to_consider: 0.5
        max_angle_to_furthest: 1.0
        #mode: 0
      PathFollowCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0
        offset_from_furthest: 5
        threshold_to_consider: 1.4
      PreferForwardCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0
        threshold_to_consider: 0.5
      TwirlingCritic:
        enabled: true
        twirling_cost_power: 1
        twirling_cost_weight: 10.0
map_saver:
  ros__parameters:
    save_map_timeout: 5.0
    free_thresh_default: 0.25
    occupied_thresh_default: 0.65
    map_subscribe_transient_local: true
planner_server:
  ros__parameters:
    global_costmap:
      update_frequency: 5.0
      publish_frequency: 5.0
      global_frame: map
      robot_base_frame: base_link
      robot_radius: 0.25

      resolution: 0.05
      track_unknown_space: true
      rolling_window: false
      # width: 20
      # height: 20
      # origin_x: -10.0
      # origin_y: -10.0
      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]
      topic_qos_overrides:
        /map:
          durability: transient_local
          reliability: reliable
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_topic: /map
        map_subscribe_transient_local: true
        use_maximum: true
        trinary_costmap: true
        track_unknown_space: true
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        observation_sources: scan
        scan:
          topic: /scan
          raytrace_min_range: 0.20
          obstacle_min_range: 0.20
          max_obstacle_height: 2.0
          clearing: true
          marking: true
          data_type: "LaserScan"
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3
        inflation_radius: 0.8  #1.75 changed to 0.8
      always_send_full_costmap: true
    expected_planner_frequency: 20.0
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_navfn_planner/NavfnPlanner"
      tolerance: 0.5
      use_astar: false
      allow_unknown: true #New layer unitll smoothserver
smoother_server:
  ros__parameters:
    smoother_plugins: ["simple_smoother"]
    simple_smoother:
      plugin: "nav2_smoother::SimpleSmoother"
      tolerance: 1.0e-10
      max_its: 1000
      do_refinement: true
behavior_server:
  ros__parameters:
    local_costmap_topic: local_costmap/costmap_raw
    global_costmap_topic: global_costmap/costmap_raw
    #local_footprint_topic: local_costmap/published_footprint
    #global_footprint_topic: global_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins: ["spin", "backup", "drive_on_heading", "wait"]
    spin:
      plugin: "nav2_behaviors/Spin"
    backup:
      plugin: "nav2_behaviors/BackUp"
    drive_on_heading:
      plugin: "nav2_behaviors/DriveOnHeading"
    wait:
      plugin: "nav2_behaviors/Wait"
    local_frame: odom
    global_frame: map
    robot_base_frame: base_link
    transform_tolerance: 0.2
    simulate_ahead_time: 2.0
    max_rotational_vel: 0.50
    min_rotational_vel: 0.40
    rotational_acc_lim: 3.2
waypoint_follower:
  ros__parameters:
    loop_rate: 5
    stop_on_failure: false
    action_server_result_timeout: 900.0
    waypoint_task_executor_plugin: "wait_at_waypoint"
    wait_at_waypoint:
      plugin: "nav2_waypoint_follower::WaitAtWaypoint"
      enabled: true
      waypoint_pause_duration: 10
collision_monitor:
  ros__parameters:
    base_frame_id: "base_link"        # unify with costmaps
    odom_frame_id: "odom"
    cmd_vel_in_topic: "cmd_vel"       # match controller output
    cmd_vel_out_topic: "cmd_vel"
    state_topic: "collision_monitor_state"
    transform_tolerance: 0.2
    source_timeout: 1.0
    base_shift_correction: true
    stop_pub_timeout: 2.0
    polygons: ["ApproachCircle"]
    ApproachCircle:
      type: "circle"
      action_type: "approach"
      radius: 0.35             # set to your robot's radius (in meters)
      time_before_collision: 1.2
      visualize: false         # optional
      enabled: true
    observation_sources: ["scan"]
    scan:
      type: "scan"
      topic: /scan
      min_height: 0.15
      max_height: 2.0
      enabled: true

velocity_smoother:
  ros__parameters:
    smoothing_frequency: 20.0
    scale_velocities: true
    max_velocity: 0.26         # Match with your robot max velocity
    max_accel: 0.25
    max_decel: 0.25
    max_angular_velocity: 1.5
    max_angular_accel: 0.5
    max_angular_decel: 0.5
    velocity_timeout: 1.0
    odom_topic: "/odom"
    use_realtime_priority: false
    feedback: "open_loop"
    deadband_velocity: 0.0